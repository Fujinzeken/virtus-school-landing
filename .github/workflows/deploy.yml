name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [med-project]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment file
        run: |
          if [ -f /root/.secrets/.virtus-school-env ]; then
            cp /root/.secrets/.virtus-school-env .env
          else
            echo "Warning: Environment file not found at /root/.secrets/.virtus-school-env"
            echo "Creating empty .env file"
            touch .env
          fi

      - name: Stop and remove old containers
        run: |
          docker compose down || true
          echo "Old containers stopped and removed"

      - name: Build Docker image
        run: |
          docker compose build

      - name: Start containers
        run: |
          docker compose up -d

      - name: Wait for application to start
        run: |
          echo "Waiting for application to start..."
          sleep 30

      - name: Check container status
        run: |
          docker compose ps
          docker compose logs --tail=100

      - name: Health check
        run: |
          echo "Checking application health..."
          MAX_ATTEMPTS=15
          ATTEMPT=0
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Checking http://localhost:3001"
            
            # Check if container is running
            if ! docker compose ps | grep -q "running"; then
              echo "❌ Container is not running!"
              docker compose logs --tail=50
              exit 1
            fi
            
            # Try to connect
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001 || echo "000")
            echo "HTTP Response Code: $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "✅ Application is running successfully!"
              echo "Response code: $HTTP_CODE"
              curl -I http://localhost:3001 || true
              exit 0
            fi
            
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Application not ready yet, waiting 5 seconds..."
              sleep 5
            fi
          done
          
          echo "❌ Application failed to start properly after $MAX_ATTEMPTS attempts"
          echo "=== Container Status ==="
          docker compose ps
          echo "=== Recent Logs ==="
          docker compose logs --tail=100
          echo "=== Network Check ==="
          netstat -tlnp | grep 3001 || true
          exit 1

      - name: Cleanup old images
        run: |
          docker image prune -f
          echo "✅ Cleanup completed"

      - name: Deployment summary
        if: success()
        run: |
          echo "🎉 Deployment successful!"
          echo "Application is running at: http://localhost:3001"
          docker compose ps
