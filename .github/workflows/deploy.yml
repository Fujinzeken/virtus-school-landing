name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [med-project]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment file
        run: |
          if [ -f /root/.secrets/.virtus-school-env ]; then
            cp /root/.secrets/.virtus-school-env .env
          else
            echo "Warning: Environment file not found at /root/.secrets/.virtus-school-env"
            echo "Creating empty .env file"
            touch .env
          fi


      - name: Build Docker image
        run: |
          docker compose build

      - name: Start containers
        run: |
          docker compose up -d

      - name: Wait for application to start
        run: |
          echo "Waiting for application to start..."
          sleep 20

      - name: Check container status
        run: |
          docker compose ps
          docker compose logs --tail=50

      - name: Health check
        run: |
          echo "Checking application health..."
          for i in {1..10}; do
            if curl -f http://localhost:3001 > /dev/null 2>&1; then
              echo "✅ Application is running successfully!"
              exit 0
            fi
            echo "Attempt $i/10: Application not ready yet, waiting..."
            sleep 5
          done
          echo "❌ Application failed to start properly"
          docker compose logs
          exit 1

      - name: Cleanup old images
        run: |
          docker image prune -f
          echo "✅ Cleanup completed"

      - name: Deployment summary
        if: success()
        run: |
          echo "🎉 Deployment successful!"
          echo "Application is running at: http://localhost:3001"
          docker compose ps
